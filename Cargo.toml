[package]
name = "FileExtraction"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = "0.29"
egui_extras = { version = "0.29", default-features = false }
rfd = "0.15"
walkdir = "2"
rust_xlsxwriter = "0.79"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = "0.17"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }

[build-dependencies]
winresource = "0.1"
